name: GT7 (RMX6688) Kernel Build

# GT7 专属构建（资产在分支 gt7-rmx6688 的 gt7/ 目录）：
# - 源码：OnePlusOSS MT6991 Android16 分支（6.6.118，与 GT7 现行系统同小版本）
# - 配置：真机提取的原厂 .config 原样作种子（gt7/stock_config.txt），olddefconfig 收敛
# - 版本串：强制对齐原厂 6.6.118-android15-8-ge58033dc8ea6-abogki498046332-4k
# - 门禁1：构建后 kernel.release 必须与原厂逐字一致，否则不打包
# - 门禁2：新内核导出的每个符号若出现在原厂模块 CRC 清单（gt7/stock_symvers.txt）中，
#         CRC 必须一致，否则不打包（这是 WiFi 等厂商模块能否加载的判据）
# - v1 不加任何补丁/KSU：先证明基线兼容，特性后续迭代

on:
  workflow_dispatch:
    inputs:
      config_mode:
        description: "stock = 原厂 config 种子；native = 树自带 gki_defconfig（二分诊断，门禁2仅报告）"
        type: choice
        options:
          - stock
          - native
          - native-mv
          - full
        default: stock

env:
  CONFIG_MODE: ${{ inputs.config_mode }}
  KERNEL_TARGET_RELEASE: "6.6.118-android15-8-ge58033dc8ea6-abogki498046332-4k"
  KERNEL_SUFFIX: "android15-8-ge58033dc8ea6-abogki498046332-4k"
  KERNEL_SRC_ZIP: "https://github.com/OnePlusOSS/android_kernel_oneplus_mt6991/archive/refs/heads/oneplus/mt6991_b_16.0.0_oneplus_ace5_ultra.zip"
  CLANG_ZIP: "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip"
  BUILDTOOLS_ZIP: "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip"
  CCACHE_DIR: "/home/runner/.ccache_gt7"

jobs:
  build:
    name: Build GT7 kernel
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout gt7 branch (baseline assets)
        uses: actions/checkout@v4
        with:
          ref: gt7-rmx6688
          path: baserepo

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 ccache curl unzip zip git perl bc bison flex \
            libssl-dev libelf-dev dwarves python3 gcc-aarch64-linux-gnu

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gt7-ccache-v2
          restore-keys: gt7-ccache-v2-

      - name: Download kernel source and toolchain
        run: |
          mkdir -p ws && cd ws
          aria2c -s16 -x16 -k1M "$KERNEL_SRC_ZIP" -o common.zip &
          aria2c -s16 -x16 -k1M "$CLANG_ZIP" -o clang.zip &
          aria2c -s16 -x16 -k1M "$BUILDTOOLS_ZIP" -o build-tools.zip &
          wait
          unzip -q common.zip && mv android_kernel_oneplus_mt6991-* common
          unzip -q clang.zip -d clang18
          unzip -q build-tools.zip -d build-tools
          rm -f common.zip clang.zip build-tools.zip
          ls common | head

      - name: Prepare source tree
        working-directory: ws
        run: |
          # 去掉 KMI 受保护导出限制（与 cctv18 配方一致，放宽厂商模块可绑定符号集）
          rm -f common/android/abi_gki_protected_exports_*
          # 配置种子：原厂 .config 原样；版本串写全后缀并关掉 LOCALVERSION_AUTO
          # （zip 源码无 .git，setlocalversion 不会再附加 scm 内容）
          mkdir -p out
          if [ "$CONFIG_MODE" = "stock" ]; then
            cp "$GITHUB_WORKSPACE/baserepo/gt7/stock_config.txt" out/.config
            ./common/scripts/config --file out/.config \
              --set-str LOCALVERSION "-${KERNEL_SUFFIX}" \
              --disable LOCALVERSION_AUTO
            grep -E "^CONFIG_LOCALVERSION" out/.config
          else
            echo "native mode: config will be generated from gki_defconfig in the Configure step"
          fi
          # 生成 abi_symbollist.raw（原厂 config 里 CONFIG_UNUSED_KSYMS_WHITELIST 指向它，
          # kleaf 构建会自动生成，直接 make 没有这个文件会卡在 gki_module_unprotected.h）。
          # 内容 = 官方 KMI 符号表（abi_gki_aarch64.xml）∪ 原厂模块 CRC 清单中的全部符号，
          # 保证厂商模块需要的导出符号不会被 TRIM_UNUSED_KSYMS 裁掉。
          python3 - "$GITHUB_WORKSPACE/baserepo/gt7/stock_symvers.txt" common/android/abi_gki_aarch64.xml abi_symbollist.raw <<'PYEOF'
          import re, sys
          symvers_path, xml_path, out_path = sys.argv[1], sys.argv[2], sys.argv[3]
          syms = set()
          with open(symvers_path) as f:
              for line in f:
                  p = line.rstrip("\n").split("\t")
                  if len(p) >= 2:
                      syms.add(p[1])
          n_stock = len(syms)
          n_xml = 0
          try:
              with open(xml_path) as f:
                  xml = f.read()
              for m in re.finditer(r'<symbol name="([^"]+)"', xml):
                  if m.group(1) not in syms:
                      n_xml += 1
                  syms.add(m.group(1))
          except FileNotFoundError:
              print(f"WARNING: {xml_path} not found, using stock symvers only")
          with open(out_path, "w") as f:
              for s in sorted(syms):
                  f.write(s + "\n")
          print(f"abi_symbollist.raw: {len(syms)} symbols (stock {n_stock} + xml-only {n_xml})")
          PYEOF
          cp abi_symbollist.raw out/abi_symbollist.raw
          cp abi_symbollist.raw common/abi_symbollist.raw
          wc -l abi_symbollist.raw

      - name: Apply feature pack F1 (lz4/zstd + BBG)
        if: ${{ inputs.config_mode == 'full' }}
        working-directory: ws
        run: |
          set -e
          exec > >(tee f1-report.txt) 2>&1
          git clone --depth=1 https://github.com/Alhkxsj/oplus_kernel_plc110 plc110
          cd ./common
          echo "=== lz4 1.10.0 + zstd 1.5.7 ==="
          cp ../plc110/zram_patch/001-lz4.patch .
          cp ../plc110/zram_patch/001-lz4-clearMake.patch .
          cp ../plc110/zram_patch/lz4armv8.S ./lib/
          cp ../plc110/zram_patch/002-zstd.patch .
          git apply -p1 --exclude=lib/lz4/lz4hc_compress.c < 001-lz4.patch
          rm -f lib/lz4/lz4hc_compress.c
          git apply -p1 < 001-lz4-clearMake.patch
          patch -p1 -F 3 < 002-zstd.patch || true
          rm -f lib/zstd/common/portability_macros.h.rej
          echo "=== Baseband Guard ==="
          curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash || true
          test -f security/baseband-guard/baseband_guard.c && grep -q "baseband-guard" security/Makefile
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          echo "=== better_net config.patch (hide IP6_NF_NAT) ==="
          cp ../plc110/other_patch/config.patch .
          patch -p1 -F 3 < config.patch
          echo "=== reject check ==="
          REJ=$(find . -name '*.rej' | head -20)
          if [ -n "$REJ" ]; then echo "PATCH REJECTS FOUND:"; echo "$REJ"; for f in $REJ; do echo "----- $f"; cat "$f"; done; exit 1; fi
          echo "F1 patches applied cleanly"

      - name: Feature configs F1
        if: ${{ inputs.config_mode == 'full' }}
        working-directory: ws
        run: |
          DEF=./common/arch/arm64/configs/gki_defconfig
          cat >> $DEF <<'EOF'
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_HEADERS_INSTALL=n
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_VEGAS=y
          CONFIG_TCP_CONG_NV=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_DEFAULT_TCP_CONG="cubic"
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_BBG=y
          CONFIG_ZRAM=y
          EOF
          echo "feature configs appended: $(grep -c '^CONFIG_' $DEF) total CONFIG lines"

      - name: Spoof /proc/version identity (full)
        if: ${{ inputs.config_mode == 'full' }}
        working-directory: ws
        run: |
          {
            echo "KBUILD_BUILD_USER<<EOF"
            echo "kleaf"
            echo "EOF"
            echo "KBUILD_BUILD_HOST<<EOF"
            echo "build-host"
            echo "EOF"
            echo "KBUILD_BUILD_VERSION<<EOF"
            echo "1"
            echo "EOF"
          } >> $GITHUB_ENV
          COMPILER='Android (11368308, +pgo, +bolt, +lto, +mlgo, based on r510928) clang version 18.0.0 (https://android.googlesource.com/toolchain/llvm-project 477610d4d0d988e69dbc3fae4fe86bff3f07f2b5), LLD 18.0.0'
          sed -i "s|.*#define LINUX_COMPILER.*|#define LINUX_COMPILER \"${COMPILER}\"|" ./common/scripts/mkcompile_h
          grep -n "LINUX_COMPILER" ./common/scripts/mkcompile_h | head -2

      - name: Port drivers F2 (ADIOS + Re-Kernel + TCP Brutal + NTFS3)
        if: ${{ inputs.config_mode == 'full' }}
        working-directory: ws
        run: |
          set -e
          git clone --depth 1 --branch oneplus/mt6991_v_15.0.2_ace5_ultra_6.6.89 --filter=blob:none --sparse https://github.com/Alhkxsj/android_kernel_oneplus_mt6991 src89
          git -C src89 sparse-checkout set --no-cone "/block/adios.c" "/block/Kconfig.iosched" "/drivers/rekernel/" "/net/ipv4/tcp_brutal.c" "/net/ipv4/Kconfig"
          git clone --depth 1 --branch v6.6.118 --filter=blob:none --sparse https://github.com/gregkh/linux upstream
          git -C upstream sparse-checkout set fs/ntfs3
          cat > f2_integrate.py <<'PYEOF2'
          import re, shutil, sys
          from pathlib import Path
          common, src89, up = Path(sys.argv[1]), Path(sys.argv[2]), Path(sys.argv[3])
          def insert_before_last(text, anchor, block):
              idx = text.rfind(anchor)
              assert idx > 0, f"anchor not found: {anchor!r}"
              return text[:idx] + block + text[idx:]
          def extract_block(text, start_marker, end_marker):
              a = text.index(start_marker)
              b = text.index(end_marker, a)
              return text[a:b]
          shutil.copy(src89 / "block/adios.c", common / "block/adios.c")
          their_iosched = (src89 / "block/Kconfig.iosched").read_text()
          adios_block = extract_block(their_iosched, "config MQ_IOSCHED_ADIOS", "config IOSCHED_BFQ")
          our_iosched_p = common / "block/Kconfig.iosched"
          our_iosched = our_iosched_p.read_text()
          assert "config IOSCHED_BFQ" in our_iosched and "MQ_IOSCHED_ADIOS" not in our_iosched
          our_iosched_p.write_text(our_iosched.replace("config IOSCHED_BFQ", adios_block + "config IOSCHED_BFQ", 1))
          with open(common / "block/Makefile", "a") as f:
              f.write("\nobj-$(CONFIG_MQ_IOSCHED_ADIOS)\t+= adios.o\n")
          dst = common / "drivers/rekernel"
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(src89 / "drivers/rekernel", dst)
          dk_p = common / "drivers/Kconfig"
          dk = dk_p.read_text()
          assert "drivers/rekernel/Kconfig" not in dk
          dk_p.write_text(insert_before_last(dk, "endmenu", 'source "drivers/rekernel/Kconfig"\n\n'))
          with open(common / "drivers/Makefile", "a") as f:
              f.write("\nobj-$(CONFIG_REKERNEL)\t\t+= rekernel/\n")
          shutil.copy(src89 / "net/ipv4/tcp_brutal.c", common / "net/ipv4/tcp_brutal.c")
          their_k = (src89 / "net/ipv4/Kconfig").read_text()
          brutal_block = extract_block(their_k, "config TCP_CONG_BRUTAL", "\nchoice")
          our_k_p = common / "net/ipv4/Kconfig"
          our_k = our_k_p.read_text()
          anchor = '\nchoice\n\tprompt "Default TCP congestion control"'
          assert anchor in our_k and "TCP_CONG_BRUTAL" not in our_k
          our_k_p.write_text(our_k.replace(anchor, "\n" + brutal_block.rstrip() + "\n" + anchor, 1))
          with open(common / "net/ipv4/Makefile", "a") as f:
              f.write("\nobj-$(CONFIG_TCP_CONG_BRUTAL) += tcp_brutal.o\n")
          dst = common / "fs/ntfs3"
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(up / "fs/ntfs3", dst)
          for q in ["block/adios.c", "drivers/rekernel/rekernel.c", "net/ipv4/tcp_brutal.c", "fs/ntfs3/super.c"]:
              assert (common / q).exists(), q
          print("F2 integration OK")
          PYEOF2
          python3 f2_integrate.py common src89 upstream
          cat >> common/arch/arm64/configs/gki_defconfig <<'EOF'
          CONFIG_MQ_IOSCHED_ADIOS=y
          CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y
          CONFIG_REKERNEL=y
          CONFIG_TCP_CONG_BRUTAL=y
          CONFIG_NTFS3_FS=y
          EOF

      - name: Droidspaces F3 (extend)
        if: ${{ inputs.config_mode == 'full' }}
        working-directory: ws
        run: |
          set -e
          exec > >(tee f3-report.txt) 2>&1
          cd common
          patch -p1 -F 3 < ../plc110/droidspaces_patch/fix_sysvipc_kabi_6_7_8.patch
          patch -p1 -F 3 < ../plc110/droidspaces_patch/fix_oplus_bsp_midas.patch
          patch -p1 -F 3 < ../plc110/droidspaces_patch/ntsync_base.patch || true
          patch -p1 -F 3 < ../plc110/droidspaces_patch/ntsync_compat_android15-6.6.patch || true
          patch -p1 -F 3 < ../plc110/droidspaces_patch/fix_cgroup_limits_kabi_6.6.89.patch
          patch -p1 -F 3 < ../plc110/droidspaces_patch/evdi_drm.patch || true
          REJ=$(find . -name '*.rej' | head -20)
          if [ -n "$REJ" ]; then echo "PATCH REJECTS FOUND:"; echo "$REJ"; for f in $REJ; do echo "----- $f"; cat "$f"; done; exit 1; fi
          echo "F3 patches applied cleanly"
          cd ..
          cat >> common/arch/arm64/configs/gki_defconfig <<'EOF'
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_DEVTMPFS=y
          CONFIG_NAMESPACES=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NTSYNC=y
          CONFIG_MACVLAN=y
          CONFIG_UNIX_DIAG=y
          CONFIG_PROC_CHILDREN=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_BT_HCIVHCI=y
          CONFIG_STATIC_USERMODEHELPER=n
          CONFIG_DRM_LINDROID_EVDI=y
          EOF

      - name: Configure (olddefconfig) and diff vs stock
        working-directory: ws
        run: |
          export PATH="$PWD/clang18/bin:$PWD/build-tools/bin:$PATH"
          BUILD_ARGS="ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabihf- CC=clang LD=ld.lld HOSTCC=clang HOSTLD=ld.lld KCFLAGS+=-Wno-error"
          if [ "$CONFIG_MODE" != "stock" ]; then
            make -C common O=$PWD/out $BUILD_ARGS gki_defconfig
            ./common/scripts/config --file out/.config \
              --set-str LOCALVERSION "-${KERNEL_SUFFIX}" \
              --disable LOCALVERSION_AUTO
            if [ "$CONFIG_MODE" = "native-mv" ]; then
              ./common/scripts/config --file out/.config --enable MODVERSIONS
              echo "native-mv: MODVERSIONS enabled on top of gki_defconfig"
            fi
          fi
          make -C common O=$PWD/out $BUILD_ARGS olddefconfig
          echo "=== config drift vs stock (lines only in one side) ===" | tee config-drift.txt
          diff <(grep -E "^CONFIG_|^# CONFIG_" "$GITHUB_WORKSPACE/baserepo/gt7/stock_config.txt" | sort) \
               <(grep -E "^CONFIG_|^# CONFIG_" out/.config | sort) >> config-drift.txt || true
          wc -l config-drift.txt
          grep -E "^CONFIG_LOCALVERSION" out/.config

      - name: Build Image
        working-directory: ws
        run: |
          export PATH="$PWD/clang18/bin:$PWD/build-tools/bin:$PATH"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE=3G
          make -C common O=$PWD/out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabihf- CC="ccache clang" LD=ld.lld HOSTCC="ccache clang" HOSTLD=ld.lld KCFLAGS+=-Wno-error -j$(nproc) Image
          ls -la out/arch/arm64/boot/Image
          ccache -s || true

      - name: Verify F2 configs landed
        if: ${{ inputs.config_mode == 'full' }}
        working-directory: ws
        run: |
          for sym in MQ_IOSCHED_ADIOS MQ_IOSCHED_DEFAULT_ADIOS REKERNEL TCP_CONG_BRUTAL NTFS3_FS TCP_CONG_BBR IP_SET ZRAM BBG MODVERSIONS CFS_BANDWIDTH CGROUP_PIDS FAIR_GROUP_SCHED USER_NS SYSVIPC NTSYNC DRM_LINDROID_EVDI MACVLAN UNIX_DIAG PROC_CHILDREN MEMCG PID_NS IPC_NS NAMESPACES; do
            grep -qx "CONFIG_${sym}=y" out/.config || { echo "MISSING CONFIG_${sym}"; exit 1; }
          done
          echo "all feature configs present"

      - name: Gate 1 — kernel release string must equal stock
        working-directory: ws
        run: |
          REL="$(cat out/include/config/kernel.release)"
          echo "built release: $REL"
          echo "target       : $KERNEL_TARGET_RELEASE"
          if [ "$REL" != "$KERNEL_TARGET_RELEASE" ]; then
            echo "::error::kernel.release mismatch — refusing to package"
            exit 1
          fi
          echo "GATE1 PASS"

      - name: Gate 2 — exported symbol CRCs vs stock module list
        working-directory: ws
        env:
          STOCK_SYMVERS: ${{ github.workspace }}/baserepo/gt7/stock_symvers.txt
        run: |
          BUILT_SYMVERS=out/Module.symvers
          [ -f "$BUILT_SYMVERS" ] || BUILT_SYMVERS=out/vmlinux.symvers
          echo "gate2 reading: $BUILT_SYMVERS"
          python3 - "$STOCK_SYMVERS" "$BUILT_SYMVERS" > gate-report.txt 2>&1 <<'PYEOF' || { cat gate-report.txt; if [ "$CONFIG_MODE" = "native" ]; then echo "::warning::GATE2 mismatch tolerated in native diagnostic mode"; else exit 1; fi; }
          import sys
          stock_path, built_path = sys.argv[1], sys.argv[2]
          stock = {}
          with open(stock_path) as f:
              for line in f:
                  p = line.rstrip("\n").split("\t")
                  if len(p) >= 2:
                      stock[p[1]] = p[0].lower()
          built = {}
          with open(built_path) as f:
              for line in f:
                  p = line.rstrip("\n").split("\t")
                  if len(p) >= 2:
                      built[p[1]] = p[0].lower()
          overlap = [s for s in built if s in stock]
          mismatch = [(s, stock[s], built[s]) for s in overlap if stock[s] != built[s]]
          missing = [s for s in stock if s not in built]
          print(f"built exports: {len(built)}")
          print(f"stock module symbol CRCs: {len(stock)}")
          print(f"overlap compared: {len(overlap)}")
          print(f"CRC mismatches: {len(mismatch)}")
          for s, a, b in mismatch[:80]:
              print(f"  MISMATCH {s}: stock={a} built={b}")
          print(f"stock symbols not exported by built vmlinux: {len(missing)} (mostly module-to-module, informational)")
          if mismatch:
              print("GATE2 FAIL")
              sys.exit(1)
          print("GATE2 PASS")
          PYEOF
          cat gate-report.txt

      - name: Package AnyKernel3
        working-directory: ws
        run: |
          git clone --depth=1 https://github.com/palazik/AnyKernel3
          rm -rf AnyKernel3/.git
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          cd AnyKernel3
          if [ "$CONFIG_MODE" = "native" ]; then
            zip -r ../AnyKernel3_GT7_6.6.118_nativecfg.zip ./*
          elif [ "$CONFIG_MODE" = "native-mv" ]; then
            zip -r ../AnyKernel3_GT7_6.6.118_nativeMV.zip ./*
          elif [ "$CONFIG_MODE" = "full" ]; then
            zip -r ../AnyKernel3_GT7_6.6.118_full.zip ./*
          else
            zip -r ../AnyKernel3_GT7_6.6.118_stockcfg.zip ./*
          fi
          cd ..
          ls -la AnyKernel3_GT7_6.6.118_*.zip

      - name: Publish package to Release
        if: ${{ success() }}
        working-directory: ws
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="gt7-${CONFIG_MODE}-${{ github.run_number }}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "GT7 kernel ($CONFIG_MODE) run ${{ github.run_number }}" --notes "config_mode=$CONFIG_MODE" *.zip gate-report.txt || \
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber *.zip gate-report.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: GT7-kernel-build
          path: |
            ws/AnyKernel3_GT7_6.6.118_*.zip
            ws/gate-report.txt
            ws/f1-report.txt
            ws/f3-report.txt
            ws/config-drift.txt
            ws/abi_symbollist.raw
            ws/out/.config
            ws/out/include/config/kernel.release
          if-no-files-found: warn
